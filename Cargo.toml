[workspace]
resolver = "3"
members = ["crates/nguda-core", "crates/nguda-engine", "crates/nguda-adapters", "src-tauri"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
nguda-core = { path = "crates/nguda-core" }
nguda-engine = { path = "crates/nguda-engine" }
nguda-adapters = { path = "crates/nguda-adapters" }

tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.5", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", default-features = false }
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
uuid = { version = "1.29", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tempfile = "3"
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3.2", default-features = false }
block2 = { version = "0.6", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
